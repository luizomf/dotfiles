# A server-wide sequence avoids ties when windows are visited within one second.
# Keep history on window objects: renaming/renumbering does not lose it.
# Indexed hooks are reload-safe and leave other hook entries intact.
set-hook -g session-window-changed[100] {
  set-option -sF @window_mru_clock '#{e|+:#{?@window_mru_clock,#{@window_mru_clock},0},1}'
  set-option -wF @window_mru '#{@window_mru_clock}'
}
set-hook -g client-session-changed[100] {
  set-option -sF @window_mru_clock '#{e|+:#{?@window_mru_clock,#{@window_mru_clock},0},1}'
  set-option -wF @window_mru '#{@window_mru_clock}'
}
set-hook -g client-attached[100] {
  set-option -sF @window_mru_clock '#{e|+:#{?@window_mru_clock,#{@window_mru_clock},0},1}'
  set-option -wF @window_mru '#{@window_mru_clock}'
}
